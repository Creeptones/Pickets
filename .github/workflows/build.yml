name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Pickets.csproj
      - name: Build release
        run: dotnet build Pickets.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Pickets.Tests/Pickets.Tests.csproj --configuration Release
      - name: Verify portable package
        run: dotnet publish Pickets.csproj --configuration Release --property:PublishProfile=win-x64 --output release/portable
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Verify installer package
        shell: pwsh
        run: |
          [xml]$project = Get-Content Pickets.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          ./installer/build-installer.ps1 -Version $version
